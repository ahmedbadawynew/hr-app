<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الموارد البشرية</title>
  <style>
    /* تنسيقات عامة للصفحة */
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      background: #f8fafc; 
      font-family: Arial, sans-serif; /* إضافة خط لجمالية الصفحة */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* تنسيق الحاوية */
    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* تنسيق العنوان */
    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    /* تنسيق الزر */
    .btn {
      display: inline-block;
      padding: 15px 30px;
      background-color: #007bff; /* لون الزر (أزرق) */
      color: white; /* لون النص */
      text-decoration: none; /* إزالة الخط السفلي من الرابط */
      border-radius: 5px; /* تدوير حواف الزر */
      font-size: 18px;
      font-weight: bold;
      transition: background-color 0.3s ease; /* تأثير حركة عند تمرير الماوس */
    }

    /* تغيير لون الزر عند تمرير الماوس */
    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>بوابة الموارد البشرية</h1>
    <p style="color: #666; margin-bottom: 30px;">اضغط على الزر أدناه للدخول إلى البوابة</p>
    
    <!-- هذا هو الزر -->
    <a href="https://script.google.com/macros/s/AKfycbwYKBVEPX10AyYhTplFKFZkGfnb9u25a7L78XExc_mnXZE83aRwvQj-QOqfW_Quh_QasQ/exec" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn">
       دخول إلى بوابة الموارد البشرية
    </a>
  </div>

</body>
</html>
